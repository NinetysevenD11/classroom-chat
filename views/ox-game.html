<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>눈치 O/X</title>
  <script src="/js/hub-embed.js?v=1"></script>
  <link rel="stylesheet" href="/css/cozy-meadow.css?v=3" />
  <link rel="stylesheet" href="/css/user-background.css?v=1" />
  <link rel="stylesheet" href="/css/ox-game.css?v=2" />
  <script src="/js/user-background.js?v=1"></script>
</head>
<body class="ox-app ox-host">
  <div class="ox-shell">
    <header class="ox-head">
      <div class="ox-head-copy">
        <h1>눈치 O/X</h1>
        <p class="ox-sub">비밀 답 · 눈치 예측 · 개인 답은 공개하지 않아요</p>
      </div>
      <div class="ox-head-meta">
        <div class="ox-code-box">
          <span class="ox-code-label">학생 참여</span>
          <strong id="joinUrl">—</strong>
          <button type="button" id="copyLinkBtn" class="btn-ghost">링크 복사</button>
        </div>
        <img id="qrImg" class="ox-qr" alt="학생 QR" hidden />
      </div>
    </header>

    <section class="ox-panel ox-status-bar">
      <div><span class="muted">단계</span> <strong id="phaseLabel">대기</strong></div>
      <div><span class="muted">라운드</span> <strong id="roundLabel">0</strong></div>
      <div><span class="muted">접속</span> <strong id="onlineLabel">0</strong></div>
      <div><span class="muted">제출</span> <strong id="submittedLabel">0</strong></div>
      <div id="timerLabel" class="ox-timer" hidden></div>
    </section>

    <div class="ox-grid">
      <section class="ox-panel">
        <h2>진행</h2>
        <div class="ox-actions" id="hostActions">
          <button type="button" id="startBtn" class="btn-primary">게임 준비 (점수 초기화)</button>
          <button type="button" id="voteBtn" class="btn-secondary" disabled>투표 시작</button>
          <button type="button" id="revealBtn" class="btn-secondary" disabled>지금 결과 보기</button>
          <button type="button" id="endBtn" class="btn-ghost">최종 순위 · 종료</button>
          <button type="button" id="resetBtn" class="btn-ghost">로비로</button>
        </div>

        <h3 class="ox-h3">질문 내기</h3>
        <textarea id="questionInput" rows="2" maxlength="120" placeholder="예: 나는 쉬는 시간에 움직이는 것이 좋다."></textarea>
        <div class="ox-actions">
          <button type="button" id="askBtn" class="btn-primary" disabled>이 질문으로 시작</button>
        </div>

        <h3 class="ox-h3">질문 은행</h3>
        <div id="themeTabs" class="ox-themes"></div>
        <div id="questionBank" class="ox-bank"></div>
      </section>

      <section class="ox-panel">
        <h2>현재 질문</h2>
        <p id="currentQuestion" class="ox-question">아직 질문이 없어요.</p>

        <h2>결과</h2>
        <div id="revealBox" class="ox-reveal">라운드 결과가 여기 표시됩니다.</div>

        <h2>참가자 · 점수</h2>
        <ol id="playerList" class="ox-players"></ol>
      </section>
    </div>

    <p id="hostStatus" class="ox-status" role="status"></p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/ox-host.js?v=2"></script>
</body>
</html>
