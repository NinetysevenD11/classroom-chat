# Render — classroom-chat-h1ll.onrender.com

services:
  - type: web
    name: classroom-chat
    runtime: node
    plan: standard
    region: singapore
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: classroom-data
      mountPath: /data
      sizeGB: 2
